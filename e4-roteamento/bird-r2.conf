# BIRD 2 — vetor de distância (RIP), roteador 2
log stderr all;
router id 10.0.20.254;          # identidade única de r2: seu endereço no segmento B
                                # (r1 usa 10.0.10.254 e r3 usa 10.0.40.13)

protocol device { }
protocol direct { ipv4; interface "eth*"; }
protocol kernel { ipv4 { export all; }; learn; }

protocol rip {
  ipv4 { import all; export all; };
  interface "*" { };
}
